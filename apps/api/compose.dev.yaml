name: portfolio-demo-api-development

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio_demo}
      POSTGRES_USER: ${POSTGRES_USER:-portfolio_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio_demo_local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - portfolio_demo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  portfolio_demo_postgres:
