services:
  postgres:
    image: postgres:16-alpine
    container_name: portfolio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio_demo
      POSTGRES_USER: portfolio_demo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - portfolio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio_demo -d portfolio_demo"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: portfolio_api
    restart: unless-stopped
    env_file:
      - ../apps/api/.env.production
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: portfolio_web
    restart: unless-stopped
    env_file:
      - ../apps/web/.env.production
    depends_on:
      - api
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: portfolio_nginx
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx/portfolio.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  portfolio_postgres_data:
